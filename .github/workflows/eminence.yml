# Eminence MU: compila o Main.exe (Windows x64, Release) e publica como artefato na aba Actions.
# Roda a cada envio no ramo "eminence" ou à mão (Actions -> Eminence Main.exe -> Run workflow).
# Não roda testes nem trava por aviso de compilação: o objetivo é só gerar o Main.exe para testar no PC.
name: Eminence Main.exe

on:
  push:
    branches: [eminence]
  workflow_dispatch:

concurrency:
  group: eminence-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 2
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  GIT_CONFIG_KEY_1: advice.detachedHead
  GIT_CONFIG_VALUE_1: 'false'

jobs:
  build:
    name: Compilar Main.exe (Windows x64 Release)
    runs-on: windows-2025-vs2026
    timeout-minutes: 150

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Instalar .NET 10
        id: dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Ativar o Visual Studio (x64)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "Visual Studio com C++ x64 não encontrado." }
          $vcvars = Join-Path $installation "VC\Auxiliary\Build\vcvars64.bat"
          $env:PATH = "$(Split-Path $vswhere);$env:PATH"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -ne $Matches[2]) {
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($LASTEXITCODE -ne 0) { throw "vcvars64.bat falhou." }

      - name: Identificar o vcpkg
        id: vcpkg
        shell: pwsh
        run: ./scripts/ci_vcpkg_cache_key.ps1

      - name: Restaurar pacotes do vcpkg (cache)
        id: vcpkg_cache
        uses: actions/cache/restore@v6
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            ~/AppData/Local/vcpkg/archives
          key: eminence-vcpkg-windows-x64-${{ steps.vcpkg.outputs.identity }}-${{ hashFiles('vcpkg.json', 'toolchain-x64.cmake', 'cmake/triplets/**') }}
          restore-keys: eminence-vcpkg-windows-x64-

      - name: Configurar (CMake)
        run: >
          cmake --preset windows-x64
          -B out/build/eminence
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=${{ github.workspace }}/toolchain-x64.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets
          -DVCPKG_INSTALLED_DIR=C:/vcpkg/installed
          -DVCPKG_MANIFEST_MODE=ON
          -DENABLE_EDITOR=OFF
          -DMU_WARNINGS_AS_ERRORS=OFF
          -DMU_ENABLE_SHADER_COMPILATION=ON
          -DGLSLANG_EXE=C:/vcpkg/installed/x64-windows/tools/glslang/glslangValidator.exe
          -DSPIRV_CROSS_EXE=C:/vcpkg/installed/x64-windows/tools/spirv-cross/spirv-cross.exe
          -DDXC_EXE=C:/vcpkg/installed/x64-windows/tools/directx-dxc/dxc.exe
          -DMU_COPY_RUNTIME_ASSETS=OFF
          -DBUILD_TESTING=OFF

      - name: Guardar pacotes do vcpkg (cache)
        if: steps.vcpkg_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/packages
            ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}

      - name: Compilar
        run: cmake --build out/build/eminence --config Release

      - name: Juntar DLLs do Visual C++
        shell: pwsh
        run: |
          $out = "out/build/eminence/src/Release"
          if (-not (Test-Path "$out/Main.exe")) { throw "Main.exe não foi gerado em $out" }
          $crt = Get-ChildItem -LiteralPath (Join-Path $env:VCToolsRedistDir "x64") -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if ($crt) { Copy-Item -Path "$($crt.FullName)\*.dll" -Destination $out -Force }
          Get-ChildItem $out | Format-Table Name, Length

      - name: Publicar o Main.exe (aba Actions -> este run -> Artifacts)
        uses: actions/upload-artifact@v7
        with:
          name: Eminence-Main-${{ github.run_number }}
          path: |
            out/build/eminence/src/Release/*.exe
            out/build/eminence/src/Release/*.dll
            out/build/eminence/src/Release/shaders/**
          if-no-files-found: error
          retention-days: 30
